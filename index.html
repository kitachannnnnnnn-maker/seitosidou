))}
            </ul>
          </div>
        </div>
      );<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>生徒指導メモアプリ</title>
  <!-- 必要なツールの読み込み（インターネット経由） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* スマホ画面下部の安全領域を確保 */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    /* 印刷時の背景色設定 */
    @media print {
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SVG Icons ---
    const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
    const IconHistory = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const IconPrinter = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>;
    const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;

    const DEFAULT_CATEGORIES = ['学習', '生活態度', '健康', '交友関係', '保護者連携', 'その他'];

    function GuidanceMemoApp() {
      const [activeTab, setActiveTab] = useState('record');
      const [students, setStudents] = useState([]);
      const [records, setRecords] = useState([]);
      const [categories, setCategories] = useState([]);
      const [classes, setClasses] = useState([]);
      const [activeClassId, setActiveClassId] = useState('');
      const [toastMessage, setToastMessage] = useState('');

      useEffect(() => {
        const savedStudents = localStorage.getItem('guidance_students');
        const savedRecords = localStorage.getItem('guidance_records');
        const savedCategories = localStorage.getItem('guidance_categories');
        const savedClasses = localStorage.getItem('guidance_classes');
        const savedActiveClass = localStorage.getItem('guidance_active_class');
        
        let initialClasses = [{ id: 'default', name: '2026年 5年2組' }];
        if (savedClasses) initialClasses = JSON.parse(savedClasses);
        setClasses(initialClasses);

        let initialActive = 'default';
        if (savedActiveClass) initialActive = savedActiveClass;
        setActiveClassId(initialActive);

        if (savedStudents) {
          let parsed = JSON.parse(savedStudents);
          parsed = parsed.map(s => s.classId ? s : { ...s, classId: 'default' });
          setStudents(parsed);
        } else {
          setStudents([
            { id: '1', name: '山田 太郎', gradeClass: '5年2組', classId: 'default' },
            { id: '2', name: '佐藤 花子', gradeClass: '5年2組', classId: 'default' }
          ]);
        }

        if (savedRecords) setRecords(JSON.parse(savedRecords));
        if (savedCategories) {
          setCategories(JSON.parse(savedCategories));
        } else {
          setCategories(DEFAULT_CATEGORIES);
        }
      }, []);

      useEffect(() => { localStorage.setItem('guidance_students', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('guidance_records', JSON.stringify(records)); }, [records]);
      useEffect(() => { localStorage.setItem('guidance_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { if (classes.length > 0) localStorage.setItem('guidance_classes', JSON.stringify(classes)); }, [classes]);
      useEffect(() => { if (activeClassId) localStorage.setItem('guidance_active_class', activeClassId); }, [activeClassId]);

      const showToast = (message) => {
        setToastMessage(message);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const activeStudents = students.filter(s => s.classId === activeClassId);

      return (
        <div className="flex justify-center bg-gray-100 min-h-screen font-sans">
          <div className="w-full max-w-md bg-white shadow-xl relative flex flex-col min-h-screen">
            
            <header className="bg-blue-600 text-white p-4 shadow-md z-10 sticky top-0 flex justify-between items-center print:hidden">
              <h1 className="text-xl font-bold tracking-wider">
                {activeTab === 'record' && '新規記録'}
                {activeTab === 'history' && '指導履歴'}
                {activeTab === 'students' && '児童・生徒管理'}
              </h1>
              <div className="text-xs bg-blue-700 px-2 py-1 rounded font-medium truncate max-w-[120px]">
                {classes.find(c => c.id === activeClassId)?.name || '未選択'}
              </div>
            </header>

            {toastMessage && (
              <div className="fixed top-16 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded-full shadow-lg flex items-center gap-2 z-50 print:hidden">
                <IconCheck />
                <span className="text-sm font-medium">{toastMessage}</span>
              </div>
            )}

            <main className="flex-1 overflow-y-auto pb-20 p-4 bg-gray-50 print:bg-white print:p-0 print:pb-0">
              {activeTab === 'record' && (
                <div className="print:hidden">
                  <RecordTab 
                    students={activeStudents} 
                    categories={categories}
                    onSave={(newRecord) => {
                      setRecords([newRecord, ...records]);
                      showToast('記録を保存しました');
                      setActiveTab('history');
                    }} 
                    onAddCategory={(newCat) => {
                      setCategories([...categories, newCat]);
                      showToast('カテゴリを追加しました');
                    }}
                  />
                </div>
              )}
              {activeTab === 'history' && (
                <HistoryTab 
                  records={records} 
                  students={activeStudents} 
                  onDeleteRecord={(id) => {
                    setRecords(records.filter(r => r.id !== id));
                    showToast('記録を削除しました');
                  }}
                />
              )}
              {activeTab === 'students' && (
                <StudentsTab 
                  students={activeStudents} 
                  records={records}
                  classes={classes}
                  activeClassId={activeClassId}
                  onAdd={(newStudent) => {
                    setStudents([...students, newStudent]);
                    showToast('追加しました');
                  }}
                  onDelete={(id) => {
                    setStudents(students.filter(s => s.id !== id));
                    showToast('削除しました');
                  }}
                  onAddClass={(newClass) => {
                    setClasses([...classes, newClass]);
                    setActiveClassId(newClass.id);
                    showToast('新しい学級を作成しました');
                  }}
                  onChangeClass={(classId) => {
                    setActiveClassId(classId);
                  }}
                  onDeleteClass={(id) => {
                    if (classes.length <= 1) {
                      showToast('最後の学級は削除できません');
                      return;
                    }
                    const newClasses = classes.filter(c => c.id !== id);
                    setClasses(newClasses);
                    setActiveClassId(newClasses[0].id);
                    showToast('学級を削除しました');
                  }}
                  onEditClass={(id, newName) => {
                    setClasses(classes.map(c => c.id === id ? { ...c, name: newName } : c));
                    showToast('学級名を変更しました');
                  }}
                  onDeleteRecord={(id) => {
                    setRecords(records.filter(r => r.id !== id));
                    showToast('記録を削除しました');
                  }}
                />
              )}
            </main>

            <nav className="bg-white border-t border-gray-200 flex justify-around p-2 sticky bottom-0 z-10 pb-safe print:hidden">
              <NavItem icon={<IconEdit />} label="記録" isActive={activeTab === 'record'} onClick={() => setActiveTab('record')} />
              <NavItem icon={<IconHistory />} label="履歴" isActive={activeTab === 'history'} onClick={() => setActiveTab('history')} />
              <NavItem icon={<IconUsers />} label="名簿" isActive={activeTab === 'students'} onClick={() => setActiveTab('students')} />
            </nav>
          </div>
        </div>
      );
    }

    // --- Tab Components ---
    function RecordTab({ students, categories, onSave, onAddCategory }) {
      const getNowYMDHM = () => {
        const d = new Date();
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
      };

      const [studentId, setStudentId] = useState('');
      const [category, setCategory] = useState(categories[0] || '');
      const [incident, setIncident] = useState('');
      const [guidance, setGuidance] = useState('');
      const [others, setOthers] = useState('');
      const [recordDate, setRecordDate] = useState(getNowYMDHM());
      const [timePeriod, setTimePeriod] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [isAddingCategory, setIsAddingCategory] = useState(false);
      const [newCategoryName, setNewCategoryName] = useState('');

      useEffect(() => {
        if (categories.length > 0 && !category) setCategory(categories[0]);
      }, [categories]);

      const filteredStudents = students.filter(s => s.name.includes(searchQuery) || s.gradeClass.includes(searchQuery));

      const handleSave = () => {
        if (!studentId) return;
        const newRecord = {
          id: Date.now().toString(),
          studentId, category, incident, guidance, others,
          date: new Date(recordDate).toISOString(),
          timePeriod,
        };
        onSave(newRecord);
        setStudentId(''); setCategory(categories[0] || '');
        setIncident(''); setGuidance(''); setOthers('');
        setRecordDate(getNowYMDHM()); setTimePeriod(''); setSearchQuery('');
      };

      const handleAddNewCategory = () => {
        if (newCategoryName.trim()) {
          onAddCategory(newCategoryName.trim());
          setCategory(newCategoryName.trim());
          setNewCategoryName(''); setIsAddingCategory(false);
        }
      };

      return (
        <div className="space-y-6">
          <section className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <label className="block text-sm font-semibold text-gray-700 mb-2">対象</label>
            {studentId ? (
              <div className="flex justify-between items-center bg-blue-50 border border-blue-200 p-3 rounded-lg mb-3">
                <div>
                  <span className="text-xs text-blue-600 block">{students.find(s => s.id === studentId)?.gradeClass}</span>
                  <span className="font-bold text-gray-800">{students.find(s => s.id === studentId)?.name}</span>
                </div>
                <button onClick={() => setStudentId('')} className="text-sm text-gray-500 bg-white px-2 py-1 rounded border">変更</button>
              </div>
            ) : (
              <div className="space-y-3">
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><IconSearch /></div>
                  <input type="text" placeholder="名前やクラスで検索..." className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                </div>
                <div className="max-h-40 overflow-y-auto border border-gray-200 rounded-lg divide-y">
                  {filteredStudents.map(student => (
                    <button key={student.id} className="w-full text-left p-3 hover:bg-blue-50 flex items-center justify-between" onClick={() => setStudentId(student.id)}>
                      <span className="font-medium text-gray-800">{student.name}</span>
                      <span className="text-xs text-gray-500">{student.gradeClass}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </section>

          <section className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-4">
            <div>
              <label className="block text-sm font-semibold text-gray-700 mb-2">日時</label>
              <input type="datetime-local" value={recordDate} onChange={(e) => setRecordDate(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg" />
            </div>
            <div>
              <label className="block text-sm font-semibold text-gray-700 mb-2">時間帯 <span className="text-xs text-gray-400 font-normal">(任意)</span></label>
              <select value={timePeriod} onChange={(e) => setTimePeriod(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg">
                <option value="">未選択</option>
                <option value="登校時・朝">登校時・朝</option>
                <option value="1時間目">1時間目</option>
                <option value="1・2時間目休み">1・2時間目休み</option>
                <option value="2時間目">2時間目</option>
                <option value="2・3時間目休み">2・3時間目休み</option>
                <option value="3時間目">3時間目</option>
                <option value="3・4時間目休み">3・4時間目休み</option>
                <option value="4時間目">4時間目</option>
                <option value="昼休み">昼休み</option>
                <option value="5時間目">5時間目</option>
                <option value="5・6時間目休み">5・6時間目休み</option>
                <option value="6時間目">6時間目</option>
                <option value="清掃・帰り">清掃・帰り</option>
                <option value="放課後">放課後</option>
                <option value="その他">その他</option>
              </select>
            </div>
          </section>

          <section className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <label className="block text-sm font-semibold text-gray-700 mb-2">カテゴリ</label>
            <div className="flex flex-wrap gap-2 items-center">
              {categories.map(cat => (
                <button key={cat} onClick={() => setCategory(cat)} className={`px-4 py-2 rounded-full text-sm font-medium ${category === cat ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'}`}>{cat}</button>
              ))}
              {isAddingCategory ? (
                <div className="flex items-center gap-2 p-1 bg-gray-50 rounded-full border border-gray-200">
                  <input type="text" value={newCategoryName} onChange={(e) => setNewCategoryName(e.target.value)} placeholder="新カテゴリ名" className="px-3 py-1 bg-transparent text-sm w-28" />
                  <button onClick={handleAddNewCategory} className="text-blue-600 text-sm font-bold px-2">追加</button>
                  <button onClick={() => setIsAddingCategory(false)} className="text-gray-500 text-sm pr-2">取消</button>
                </div>
              ) : (
                <button onClick={() => setIsAddingCategory(true)} className="px-3 py-2 rounded-full text-sm font-medium border border-dashed border-gray-400 text-gray-500 flex items-center gap-1"><IconPlus /> 追加</button>
              )}
            </div>
          </section>

          <section className="space-y-4">
            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
              <label className="block text-sm font-semibold text-gray-700 mb-2">何があったのか <span className="text-xs text-gray-400 font-normal">(事象・事実)</span></label>
              <textarea className="w-full h-24 p-3 border border-gray-300 rounded-lg" value={incident} onChange={(e) => setIncident(e.target.value)}></textarea>
            </div>
            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
              <label className="block text-sm font-semibold text-gray-700 mb-2">どのような指導をしたのか <span className="text-xs text-gray-400 font-normal">(指導内容)</span></label>
              <textarea className="w-full h-24 p-3 border border-gray-300 rounded-lg" value={guidance} onChange={(e) => setGuidance(e.target.value)}></textarea>
            </div>
            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
              <label className="block text-sm font-semibold text-gray-700 mb-2">その他 <span className="text-xs text-gray-400 font-normal">(約束等)</span></label>
              <textarea className="w-full h-20 p-3 border border-gray-300 rounded-lg" value={others} onChange={(e) => setOthers(e.target.value)}></textarea>
            </div>
          </section>

          <button onClick={handleSave} disabled={!studentId || (!incident.trim() && !guidance.trim() && !others.trim())} className={`w-full py-4 rounded-xl font-bold text-lg flex justify-center items-center gap-2 ${!studentId || (!incident.trim() && !guidance.trim() && !others.trim()) ? 'bg-gray-300 text-gray-500' : 'bg-blue-600 text-white hover:bg-blue-700'}`}><IconEdit /> 記録を保存する</button>
        </div>
      );
    }

    function HistoryTab({ records, students, onDeleteRecord }) {
      const [filter, setFilter] = useState('');
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const formatDate = (isoString) => {
        const d = new Date(isoString);
        return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
      };
      const filteredRecords = records.filter(record => {
        const student = students.find(s => s.id === record.studentId);
        if (!student) return false;
        if (!filter) return true;
        const searchTarget = `${record.note || ''} ${record.incident || ''} ${record.guidance || ''} ${record.others || ''}`;
        return student.name.includes(filter) || student.gradeClass.includes(filter) || record.category.includes(filter) || searchTarget.includes(filter);
      });

      return (
        <div className="space-y-4 print:space-y-2">
          <div className="flex justify-between items-center print:hidden">
            <h2 className="font-bold text-gray-800">指導履歴一覧</h2>
            <button onClick={() => window.print()} className="flex items-center gap-1 bg-gray-100 px-3 py-1.5 rounded-lg text-sm font-medium"><IconPrinter />印刷</button>
          </div>
          <div className="relative print:hidden">
            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><IconSearch /></div>
            <input type="text" placeholder="名前、クラス、内容で検索..." className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg" value={filter} onChange={(e) => setFilter(e.target.value)} />
          </div>
          <div className="space-y-3 print:space-y-1">
            {filteredRecords.map(record => {
              const student = students.find(s => s.id === record.studentId);
              return (
                <div key={record.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 print:shadow-none print:border-b print:rounded-none">
                  <div className="flex justify-between items-start mb-2">
                    <div><span className="text-xs text-gray-500">{student?.gradeClass}</span><h3 className="font-bold text-gray-800">{student?.name}</h3></div>
                    <div className="text-right"><span className="text-xs text-gray-400 block">{formatDate(record.date)}</span>{record.timePeriod && <span className="text-xs text-blue-500 font-medium">{record.timePeriod}</span>}</div>
                  </div>
                  <div className="mb-2 flex justify-between items-center">
                    <span className="inline-block px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded font-medium">{record.category}</span>
                    <div className="print:hidden">
                      {confirmDeleteId === record.id ? (
                        <div className="flex gap-2">
                          <button onClick={() => setConfirmDeleteId(null)} className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">ｷｬﾝｾﾙ</button>
                          <button onClick={() => { onDeleteRecord(record.id); setConfirmDeleteId(null); }} className="text-xs text-white bg-red-500 px-2 py-1 rounded">削除</button>
                        </div>
                      ) : <button onClick={() => setConfirmDeleteId(record.id)} className="text-gray-400"><IconTrash /></button>}
                    </div>
                  </div>
                  <div className="space-y-2 mt-1">
                    {record.incident && <div><span className="text-[11px] font-bold text-gray-500 block mb-0.5">【事象・事実】</span><p className="text-gray-700 text-sm whitespace-pre-wrap pl-1 border-l-2 border-gray-200">{record.incident}</p></div>}
                    {record.guidance && <div><span className="text-[11px] font-bold text-gray-500 block mb-0.5">【指導内容】</span><p className="text-gray-700 text-sm whitespace-pre-wrap pl-1 border-l-2 border-blue-200">{record.guidance}</p></div>}
                    {record.others && <div><span className="text-[11px] font-bold text-gray-500 block mb-0.5">【その他・約束】</span><p className="text-gray-700 text-sm whitespace-pre-wrap pl-1 border-l-2 border-green-200">{record.others}</p></div>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function StudentsTab({ students, records, classes, activeClassId, onAdd, onDelete, onAddClass, onChangeClass, onDeleteClass, onEditClass, onDeleteRecord }) {
      const [name, setName] = useState('');
      const [gradeClass, setGradeClass] = useState('');
      const [selectedStudentId, setSelectedStudentId] = useState(null);
      const [newClassName, setNewClassName] = useState('');
      const [isEditingClass, setIsEditingClass] = useState(false);
      const [editingClassName, setEditingClassName] = useState('');
      const [confirmDeleteClassId, setConfirmDeleteClassId] = useState(null);
      const [confirmDeleteRecordId, setConfirmDeleteRecordId] = useState(null);

      if (selectedStudentId) {
        const student = students.find(s => s.id === selectedStudentId);
        if (!student) { setSelectedStudentId(null); return null; }
        const studentRecords = records.filter(r => r.studentId === selectedStudentId);
        const categoryCounts = studentRecords.reduce((acc, r) => { acc[r.category] = (acc[r.category] || 0) + 1; return acc; }, {});
        const formatDate = (iso) => { const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`; };

        return (
          <div className="space-y-4">
            <div className="flex justify-between items-center print:hidden mb-2">
              <button onClick={() => setSelectedStudentId(null)} className="text-blue-600 text-sm font-bold">&larr; 戻る</button>
              <button onClick={() => window.print()} className="flex items-center gap-1 bg-gray-100 px-3 py-1.5 rounded-lg text-sm font-medium"><IconPrinter />印刷</button>
            </div>
            <div className="bg-white p-4 rounded-xl shadow-sm print:shadow-none print:border-b"><div className="text-sm text-gray-500">{student.gradeClass}</div><h2 className="text-xl font-bold text-gray-800">{student.name}</h2></div>
            <div className="bg-white p-4 rounded-xl shadow-sm print:shadow-none print:border-none">
              <h3 className="font-semibold text-gray-800 mb-3 text-sm">カテゴリ別指導回数</h3>
              <div className="flex flex-wrap gap-2">
                {Object.entries(categoryCounts).map(([cat, count]) => <span key={cat} className="px-3 py-1 bg-blue-50 text-blue-700 text-xs rounded-full">{cat}: <span className="font-bold">{count}</span></span>)}
              </div>
            </div>
            <div className="space-y-3">
              {studentRecords.map(record => (
                <div key={record.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 print:shadow-none print:border-b">
                   <div className="flex justify-between items-start mb-2">
                    <div className="flex items-center gap-2">
                      <span className="inline-block px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded font-medium">{record.category}</span>
                      <div className="print:hidden">
                        {confirmDeleteRecordId === record.id ? (
                          <div className="flex gap-2">
                            <button onClick={() => setConfirmDeleteRecordId(null)} className="text-[10px] bg-gray-100 px-2 py-1 rounded">ｷｬﾝｾﾙ</button>
                            <button onClick={() => { onDeleteRecord(record.id); setConfirmDeleteRecordId(null); }} className="text-[10px] text-white bg-red-500 px-2 py-1 rounded">削除</button>
                          </div>
                        ) : <button onClick={() => setConfirmDeleteRecordId(record.id)} className="text-gray-400"><IconTrash /></button>}
                      </div>
                    </div>
                    <div className="text-right"><span className="text-xs text-gray-400 block">{formatDate(record.date)}</span></div>
                  </div>
                  <div className="space-y-2 mt-1">
                    {record.incident && <div><span className="text-[11px] font-bold text-gray-500 block mb-0.5">【事象・事実】</span><p className="text-gray-700 text-sm whitespace-pre-wrap pl-1 border-l-2 border-gray-200">{record.incident}</p></div>}
                    {record.guidance && <div><span className="text-[11px] font-bold text-gray-500 block mb-0.5">【指導内容】</span><p className="text-gray-700 text-sm whitespace-pre-wrap pl-1 border-l-2 border-blue-200">{record.guidance}</p></div>}
                    {record.others && <div><span className="text-[11px] font-bold text-gray-500 block mb-0.5">【その他・約束】</span><p className="text-gray-700 text-sm whitespace-pre-wrap pl-1 border-l-2 border-green-200">{record.others}</p></div>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      const activeClass = classes.find(c => c.id === activeClassId);

      return (
        <div className="space-y-6 print:hidden">
          <section className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-3">
            <h3 className="font-semibold text-gray-800 text-sm">学級・年度の切り替え</h3>
            {isEditingClass ? (
              <div className="flex gap-2">
                <input type="text" className="flex-1 p-2 border border-gray-300 rounded-lg text-sm" value={editingClassName} onChange={(e) => setEditingClassName(e.target.value)} />
                <button onClick={() => { onEditClass(activeClassId, editingClassName); setIsEditingClass(false); }} className="px-3 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold">保存</button>
              </div>
            ) : (
              <div className="flex gap-2">
                <select value={activeClassId} onChange={(e) => { onChangeClass(e.target.value); setSelectedStudentId(null); }} className="flex-1 p-2 border border-gray-300 rounded-lg">
                  {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
                <button onClick={() => { setEditingClassName(activeClass?.name || ''); setIsEditingClass(true); }} className="p-2 text-gray-500"><IconEdit /></button>
              </div>
            )}
            <div className="flex gap-2 pt-2 border-t border-gray-100">
              <input type="text" placeholder="新しい学級名を入力" className="flex-1 p-2 border border-gray-300 rounded-lg text-sm" value={newClassName} onChange={(e) => setNewClassName(e.target.value)} />
              <button onClick={() => { onAddClass({id: Date.now().toString(), name: newClassName}); setNewClassName(''); }} className="px-3 py-2 bg-gray-800 text-white rounded-lg text-sm font-bold">作成</button>
            </div>
          </section>

          <form onSubmit={(e) => { e.preventDefault(); if(name && gradeClass) { onAdd({id: Date.now().toString(), name, gradeClass, classId: activeClassId}); setName(''); setGradeClass(''); } }} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
            <h3 className="font-semibold text-gray-800 text-sm mb-2">名簿に追加</h3>
            <div><label className="block text-xs text-gray-500 mb-1">学年・組</label><input type="text" className="w-full p-2 border border-gray-300 rounded-lg" value={gradeClass} onChange={(e) => setGradeClass(e.target.value)} required /></div>
            <div><label className="block text-xs text-gray-500 mb-1">氏名</label><input type="text" className="w-full p-2 border border-gray-300 rounded-lg" value={name} onChange={(e) => setName(e.target.value)} required /></div>
            <button type="submit" className="w-full bg-gray-800 text-white py-2 rounded-lg font-medium">追加する</button>
          </form>

          <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <h3 className="font-semibold text-gray-800 p-4 border-b bg-gray-50">名簿一覧</h3>
            <ul className="divide-y divide-gray-100">
              {students.map(student => (
                <li key={student.id} className="p-4 flex justify-between items-center cursor-pointer" onClick={() => setSelectedStudentId(student.id)}>
                  <div><div className="text-xs text-gray-500">{student.gradeClass}</div><div className="font-medium text-gray-800">{student.name}</div></div>
                  <button onClick={(e) => { e.stopPropagation(); onDelete(student.id); }} className="text-xs text-red-500 px-2 py-1 bg-red-50 rounded">削除</button>
                </li>
              ))}
            </ul>
          </div>
        </div>
      );
    }

    function NavItem({ icon, label, isActive, onClick }) {
      return (
        <button onClick={onClick} className={`flex flex-col items-center justify-center w-full py-2 ${isActive ? 'text-blue-600' : 'text-gray-400'}`}>
          <div>{icon}</div><span className="text-[10px] mt-1 font-medium">{label}</span>
        </button>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GuidanceMemoApp />);
  </script>
</body>
</html>
